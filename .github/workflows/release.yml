# npm 发布：push v* tag 触发，使用 Trusted Publishing（OIDC，无需 API token）。
# 前置一次性配置：npmjs.com → 包 grafana-mcp（尚未发布时先以 Pending Publisher 占名）
# → Settings → Trusted Publisher：repository owner=itzhouq，repository=grafana-mcp，
#   workflow filename=release.yml，environment 留空。
# 注意：Trusted Publishing 要求 npm CLI >= 11.5.1，因此显式升级 npm。
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 冒烟测试（无凭据模式，发布前把关）
        run: bun run smoke
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: 升级 npm（Trusted Publishing 要求 >= 11.5.1）
        run: npm install -g npm@latest
      - name: 已发布版本守卫（本地直发过的版本不重复发）
        id: check
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "grafana-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "v$VERSION 已在 npm 上，跳过发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        run: npm publish
